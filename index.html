<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso via Wi-Fi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
            min-height: 100vh;
        }

        .topo {
            background: #0066cc;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .topo h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .topo p {
            font-size: 15px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo h2 {
            font-size: 22px;
            color: #0066cc;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #666;
        }

        .plano {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .plano h3 {
            color: #0066cc;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .tempo {
            color: #555;
            margin-bottom: 8px;
        }

        .preco {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .botao {
            display: block;
            width: 100%;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .botao:hover {
            background: #0052a3;
        }

        .rodape {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin: 30px 0;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h1>ACESSO FACIL</h1>
        <p>Escolha seu plano de acesso</p>
    </div>

    <div class="container">

        <div class="titulo">
            <h2>Planos disponíveis</h2>
            <p>Escolha o período de acesso desejado</p>
        </div>

        <!-- PLANO 1 -->
        <div class="plano">
            <h3>Plano 1</h3>

            <div class="tempo">
                Acesso por 1 hora
            </div>

            <div class="preco">
                R$ 5,00
            </div>

            <a href="#" class="botao">
                Comprar
            </a>
        </div>

        <!-- PLANO 2 -->
        <div class="plano">
            <h3>Plano 2</h3>

            <div class="tempo">
                Acesso por 3 horas
            </div>

            <div class="preco">
                R$ 10,00
            </div>

            <a href="#" class="botao">
                Comprar
            </a>
        </div>

        <!-- PLANO 3 -->
        <div class="plano">
            <h3>Plano 3</h3>

            <div class="tempo">
                Acesso por 24 horas
            </div>

            <div class="preco">
                R$ 20,00
            </div>

            <a href="#" class="botao">
                Comprar
            </a>
        </div>

        <div class="rodape">
            Após o pagamento, seu acesso será liberado.
        </div>

    </div>

</body>
</html>
